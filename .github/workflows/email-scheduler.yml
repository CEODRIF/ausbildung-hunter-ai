# Email Scheduler — the durable, browser-independent trigger for scheduled sends.
#
# REQUESTED cadence: every 5 minutes (GitHub cron is UTC) on the default
# branch (main). ACTUAL cadence is NOT guaranteed: the `schedule` trigger is
# best-effort and GitHub throttles it under load (5 minutes is the finest
# interval; runs are not exact). Observed in this repository (74 schedule
# runs, 2026-10-10 → 2026-10-23): ≈6 runs/day instead of 288 — gaps min
# 12.6 min, avg ≈4 h, max ≈9.7 h.
#
# Consequence, by design: a due job is sent at the next tick that actually
# runs — minutes to (rarely) hours after its scheduled instant, never before
# (the claim SQL gates on the due instant). Nothing is lost: due jobs stay
# queued with a past due-time and every tick drains as much of the backlog as
# its bounded budget allows. A controlled on-demand tick is available any
# time via `workflow_dispatch` (Actions → Email Scheduler → Run workflow).
#
# Each run makes authenticated GET calls to the secure server-side scheduler
# endpoints:
#   1. /api/cron/email-scheduler — the protected application-campaign engine,
#   2. /api/cron/bew-scheduler   — the ISOLATED Bewerbung-Automation engine
#      (an EXISTING endpoint; drains immediate batches past the first slice
#      and SCHEDULED batches that are now due through the same FOR UPDATE
#      SKIP LOCKED idempotency core — nothing is double-sent).
# Each performs its bounded claim+batch loop over its own durable engine.
# The browser is never involved.
#
# Cost: the repository is PUBLIC, so GitHub Actions minutes are unlimited
# and free — this scheduler costs zero (no Vercel Pro, no paid services).
#
# DISABLED BY DEFAULT: the job only runs when the repository VARIABLE
# `EMAIL_SCHEDULER_GH` is set to the exact string `true`. Enable it ONLY
# after BOTH of these are configured safely:
#   1. This code is deployed to the production origin (the endpoint must
#      exist there — a pre-deploy tick just 404s).
#   2. Repository SECRET `CRON_SECRET` (Settings → Secrets and variables →
#      Actions → New repository secret) contains the SAME random value
#      (≥16 chars) as the app's server environment variable CRON_SECRET —
#      the endpoint fails closed (401, no work) otherwise.
#   Without the secret the job fails loudly instead of hammering.
#
# Optional repository variable:
#   EMAIL_SCHEDULER_URL — production origin (default: https://ausbildungsweg.net)
#
# Safety:
#  - Claims are atomic in Postgres (FOR UPDATE SKIP LOCKED) and the
#    endpoint's batch loop is bounded (≤3 rounds, 45s): overlapping runs
#    (schedule + manual workflow_dispatch) can never double-send, and
#    messages are only claimable at/after their due instant — never early.
#  - The job echoes only the endpoint's counter JSON
#    (ok/claimed/processed/stop/elapsed_ms) — no secrets, no recipients.
#  - Transient network/5xx failures on the GET are retried by curl
#    (--retry 3 --retry-delay 10): the call is idempotent because claims are
#    atomic, so a retry can never double-send. A 401 (wrong/missing secret)
#    is NOT retried — a red scheduler is better than a silent one.
name: Email Scheduler

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  tick:
    name: scheduler tick
    # Gated: off unless the repo variable says exactly "true".
    if: vars.EMAIL_SCHEDULER_GH == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: email-scheduler-tick
      cancel-in-progress: false # serialize overlapping ticks, never kill mid-batch
    steps:
      - name: Scheduler tick
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          DEPLOY_URL: ${{ vars.EMAIL_SCHEDULER_URL || 'https://ausbildungsweg.net' }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::CRON_SECRET is not set in repository secrets."
            exit 1
          fi
          : "${DEPLOY_URL:=https://ausbildungsweg.net}"
          DEPLOY_URL="${DEPLOY_URL%/}"
          # 401 (bad/missing secret) fails the run on purpose and is NOT
          # retried; transient network/5xx failures are retried (the GET is
          # idempotent — atomic claims make a retry double-send-safe).
          body="$(curl -sS --fail-with-body --max-time 90 --retry 3 --retry-delay 10 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$DEPLOY_URL/api/cron/email-scheduler")"
          echo "Scheduler tick: $body"
      - name: Bewerbung-Automation scheduler tick
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          DEPLOY_URL: ${{ vars.EMAIL_SCHEDULER_URL || 'https://ausbildungsweg.net' }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::CRON_SECRET is not set in repository secrets."
            exit 1
          fi
          : "${DEPLOY_URL:=https://ausbildungsweg.net}"
          DEPLOY_URL="${DEPLOY_URL%/}"
          # The ISOLATED bew drain — the SAME existing CRON_SECRET, the SAME
          # fail-closed auth, the SAME */5 cadence and concurrency group. It
          # ticks the EXISTING /api/cron/bew-scheduler endpoint (not a new one),
          # which claims due bew applications (immediate batches past the first
          # slice, and SCHEDULED batches that are now due) through the same
          # FOR UPDATE SKIP LOCKED idempotency core, so nothing double-sends.
          # 401 fails the run on purpose (a red tick > a silent one);
          # transient network/5xx failures are retried (the GET is
          # idempotent — atomic claims make a retry double-send-safe).
          body="$(curl -sS --fail-with-body --max-time 90 --retry 3 --retry-delay 10 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$DEPLOY_URL/api/cron/bew-scheduler")"
          echo "Bew scheduler tick: $body"
      - name: Bewerbung-Studio scheduler tick
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          DEPLOY_URL: ${{ vars.EMAIL_SCHEDULER_URL || 'https://ausbildungsweg.net' }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::CRON_SECRET is not set in repository secrets."
            exit 1
          fi
          : "${DEPLOY_URL:=https://ausbildungsweg.net}"
          DEPLOY_URL="${DEPLOY_URL%/}"
          # The AI Bewerbung Studio drain — SAME secret, SAME cadence, SAME
          # concurrency group. Ticks /api/cron/studio-scheduler, which
          # recovers stale attempts and claims+dispatches due SCHEDULED
          # application sends (FOR UPDATE SKIP LOCKED, atomic re-claim —
          # nothing double-sends). Deploy the branch before enabling the
          # variable if it is not yet live (a 404 fails the run on purpose).
          body="$(curl -sS --fail-with-body --max-time 90 --retry 3 --retry-delay 10 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$DEPLOY_URL/api/cron/studio-scheduler")"
          echo "Studio scheduler tick: $body"
