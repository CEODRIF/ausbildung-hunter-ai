# Container image pipeline — GitHub Container Registry (GHCR).
#
# Builds the production Docker image (see /Dockerfile) on every push to
# main and on manual dispatch, and pushes two tags:
#   - <commit-sha>   immutable, deploy-pinned (use this in Azure)
#   - latest         rolling, for convenience
#
# Security model:
#   - Authentication: GITHUB_TOKEN (job-scoped, auto-expires) — no PATs.
#   - Permissions: contents:read + packages:write only (minimum).
#   - Build args: the two NEXT_PUBLIC_* values ONLY (public by design;
#     inlined into the client bundle / baked into the CSP). Private
#     secrets are NEVER build args — they are injected by the container
#     platform at runtime.
#   - The workflow fails loudly if the public build-time secrets are
#     missing (matching ci.yml's no-dummy-values policy).

name: Docker publish (GHCR)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  # GHCR image names must be lowercase; the repository owner is
  # "CEODRIF", so the image name is explicitly lowercased here.
  IMAGE_NAME: ghcr.io/ceodrif/ausbildung-hunter-ai

jobs:
  build-and-push:
    name: build & push image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify required build-time secrets
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Missing repository secrets NEXT_PUBLIC_SUPABASE_URL and/or NEXT_PUBLIC_SUPABASE_ANON_KEY."
            echo "The build bakes NEXT_PUBLIC_SUPABASE_URL into the CSP (next.config.ts) and inlines both NEXT_PUBLIC_* values into the client bundle. Set them in Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
